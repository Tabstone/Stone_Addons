name: Validate add-on metadata

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  addon-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Install PyYAML
        run: python3 -m pip install PyYAML

      - name: Validate add-on metadata
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import runpy
          import sys
          import yaml

          errors = []

          def load_yaml(path: Path):
              try:
                  return yaml.safe_load(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  errors.append(f"{path}: invalid YAML ({exc})")
                  return None

          repository = Path("repository.yaml")
          if repository.is_file():
              load_yaml(repository)
          else:
              errors.append("repository.yaml: missing")

          version_re = re.compile(r"^(?:\d+\.\d+\.\d+-\d+|sha-\d+)$")
          tag_re = re.compile(r"^(?:v?\d+\.\d+(?:\.\d+)?|sha-[0-9a-f]{7,40})$")

          addon_dirs = sorted(
              path for path in Path(".").iterdir()
              if path.is_dir() and (path / "config.yaml").is_file()
          )
          sync_script = runpy.run_path(".github/scripts/sync_upstream_metadata.py")
          updates = sync_script["UPDATES"]
          sync_workflow = load_yaml(Path(".github/workflows/sync-upstream.yml"))
          sync_steps = {
              step.get("id"): step
              for step in (sync_workflow or {}).get("jobs", {}).get("sync", {}).get("steps", [])
          }
          sync_env = sync_steps.get("update", {}).get("env", {})
          upstream_run = sync_steps.get("upstream", {}).get("run", "")
          synced_names = {update.slug for update in updates}
          source_built_names = {
              path.name for path in addon_dirs
              if not (load_yaml(path / "config.yaml") or {}).get("image")
          }
          if source_built_names != synced_names:
              errors.append(
                  f"Upstream sync registration mismatch: missing={sorted(source_built_names - synced_names)}, "
                  f"stale={sorted(synced_names - source_built_names)}"
              )
          if len(synced_names) != len(updates):
              errors.append("Upstream sync contains duplicate add-on registrations")

          for update in updates:
              for variable in (update.version_env, update.tag_env):
                  binding = sync_env.get(variable, "")
                  output = re.fullmatch(r"\$\{\{\s*steps\.upstream\.outputs\.(\w+)\s*\}\}", binding)
                  if not output or f"{output.group(1)}=" not in upstream_run:
                      errors.append(f"{update.slug}: {variable} is not wired to an upstream workflow output")

          for addon_dir in addon_dirs:
              for required_file in (
                  "Dockerfile", "run.sh", "DOCS.md", "CHANGELOG.md", "icon.png", "logo.png",
                  "rootfs/etc/cont-init.d/20-folders.sh",
              ):
                  if not (addon_dir / required_file).is_file():
                      errors.append(f"{addon_dir / required_file}: missing")
              config_path = addon_dir / "config.yaml"
              build_path = addon_dir / "build.yaml"
              config = load_yaml(config_path)
              if build_path.is_file():
                  build = load_yaml(build_path)
              else:
                  errors.append(f"{build_path}: missing build.yaml")
                  build = None

              if config is not None:
                  for field in ("name", "slug", "description", "url"):
                      if not isinstance(config.get(field), str) or not config[field]:
                          errors.append(f"{config_path}: {field} must be a non-empty string")
                  if config.get("slug") != addon_dir.name:
                      errors.append(f"{config_path}: slug must match the add-on directory")
                  if set(config.get("options", {})) != set(config.get("schema", {})):
                      errors.append(f"{config_path}: option names and schema names do not match")
                  version = config.get("version")
                  if not isinstance(version, str) or not version_re.match(version):
                      errors.append(
                          f"{config_path}: version '{version}' does not match {version_re.pattern}"
                      )

              if build is not None:
                  build_from = build.get("build_from")
                  if not isinstance(build_from, dict) or not build_from:
                      errors.append(f"{build_path}: build_from missing or not a map")
                  else:
                      if config is not None and set(config.get("arch", [])) != set(build_from):
                          errors.append(f"{build_path}: build_from architectures do not match config.yaml")
                      for arch, image in build_from.items():
                          if not isinstance(image, str) or ":" not in image:
                              errors.append(
                                  f"{build_path}: build_from {arch} value '{image}' is invalid"
                              )
                              continue
                          tag = image.rsplit(":", 1)[1]
                          allow_latest = tag == "latest" and (
                              addon_dir.name == "clirelay"
                              or image.startswith("ghcr.io/home-assistant/")
                          )
                          if not allow_latest and not tag_re.match(tag):
                              errors.append(
                                  f"{build_path}: build_from {arch} tag '{tag}' does not match {tag_re.pattern}"
                              )

          if errors:
              for error in errors:
                  print(error)
              sys.exit(1)

          print("Addon metadata validation passed.")
          PY
