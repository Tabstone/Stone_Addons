name: Build TabS Cleaner image

on:
  push:
    branches:
      - main
    paths:
      - tabs-cleaner/**
      - .github/workflows/tabs-cleaner-image.yml
  pull_request:
    paths:
      - tabs-cleaner/**
      - .github/workflows/tabs-cleaner-image.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare image build
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      build_matrix: ${{ steps.matrix.outputs.matrix }}
      description: ${{ steps.normalize.outputs.description }}
      image_name: ${{ steps.normalize.outputs.image_name }}
      name: ${{ steps.normalize.outputs.name }}
      registry_prefix: ${{ steps.normalize.outputs.registry_prefix }}
      url: ${{ steps.normalize.outputs.url }}
      version: ${{ steps.normalize.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0

      - name: Read add-on metadata
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: ./tabs-cleaner

      - name: Normalize image metadata
        id: normalize
        shell: bash
        env:
          DESCRIPTION_JSON: ${{ steps.info.outputs.description }}
          IMAGE_JSON: ${{ steps.info.outputs.image }}
          NAME_JSON: ${{ steps.info.outputs.name }}
          URL_JSON: ${{ steps.info.outputs.url }}
          VERSION_JSON: ${{ steps.info.outputs.version }}
        run: |
          image="$(jq -r . <<< "${IMAGE_JSON}")"
          name="$(jq -r . <<< "${NAME_JSON}")"
          description="$(jq -r . <<< "${DESCRIPTION_JSON}")"
          url="$(jq -r . <<< "${URL_JSON}")"
          version="$(jq -r . <<< "${VERSION_JSON}")"

          echo "image_name=${image##*/}" >> "$GITHUB_OUTPUT"
          echo "registry_prefix=${image%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "description=${description}" >> "$GITHUB_OUTPUT"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Prepare multi-arch matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.06.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.normalize.outputs.image_name }}
          registry-prefix: ${{ steps.normalize.outputs.registry_prefix }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base:latest
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./tabs-cleaner
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          labels: |
            io.hass.type=app
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            ${{ needs.prepare.outputs.url && format('io.hass.url={0}', needs.prepare.outputs.url) || '' }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Publish multi-arch manifest
    needs:
      - prepare
      - build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.06.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ needs.prepare.outputs.image_name }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          registry-prefix: ${{ needs.prepare.outputs.registry_prefix }}
